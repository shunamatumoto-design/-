<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOEIC対策英単語帳</title>
    <style>

        input, textarea, select { -webkit-user-select: text; user-select: text; }
        
        .screen { display: none; flex-direction: column; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; background-color: #f0f3f8; }
        .screen.active { display: flex; }
        
        header { background: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .back-btn { background: none; border: none; color: white; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px; }
        .reset-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white; font-size: 12px; font-weight: bold; cursor: pointer; padding: 5px 10px; border-radius: 5px; display: none; }
        .header-center { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .header-title { font-weight: bold; font-size: 18px; }
        .header-sub { font-size: 0.8em; color: #a8e6cf; font-weight: bold; margin-top: 3px; }

        #home-screen { justify-content: center; align-items: center; background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%); }
        .game-title { font-size: 2.2em; font-weight: 900; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 30px; letter-spacing: 1px; text-align: center; padding: 0 10px; }
        .menu-btn { background: rgba(255, 255, 255, 0.9); color: #2c3e50; border: none; padding: 15px 30px; margin: 8px; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn.primary { background: #3498db; color: white; }
        .menu-btn.warning { background: #e74c3c; color: white; }

        .content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        
        #card-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .card { width: 100%; max-width: 350px; height: 350px; background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.8em; font-weight: bold; text-align: center; cursor: pointer; position: absolute; transition: transform 0.3s ease, opacity 0.3s ease; padding: 20px; box-sizing: border-box; touch-action: none; }
        .english-ans { color: #e74c3c; font-size: 1.2em; margin-bottom: 15px; display: none; }
        
        .audio-btn { background: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 25px; font-size: 0.6em; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .audio-btn:active { transform: scale(0.95); }
        
        .instruction { font-size: 0.4em; color: #888; position: absolute; bottom: 20px; }
        
        .section-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .section-title { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        button.action-btn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        input[type="range"] { flex: 1; margin: 0 15px; }
        .deck-item { padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .deck-item.active-deck { border-color: #3498db; background: #eaf5ff; border-width: 2px; }
        
        .edit-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .edit-row input { flex: 1; padding: 8px; font-size: 14px; margin: 0; min-width: 0; }
        .del-btn { background: #e74c3c; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* 単語帳作成用のチェックスタイル */
        .check-btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .check-btn-group button { flex: 1; padding: 8px; background: #ecf0f1; border: 1px solid #bdc3c7; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .check-btn-group button:active { background: #d5dbdb; }
        
        .hidden { display: none !important; }
        #empty-msg { font-size: 1.2em; color: #666; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="home-screen" class="screen active">
    <div class="game-title">TOEIC対策英単語帳</div>
    <button class="menu-btn primary" onclick="navTo('study-all')">🎮 すべて出題</button>
    <button class="menu-btn warning" onclick="navTo('study-weak')">💔 苦手モード</button>
    <button class="menu-btn" onclick="navTo('add')">✏️ 単語を追加・編集</button>
    <button class="menu-btn" onclick="navTo('deck')">📁 単語帳を作る</button>
    <button class="menu-btn" onclick="navTo('settings')">⚙️ 設定</button>
</div>

<div id="study-screen" class="screen">
    <header>
        <button class="back-btn" onclick="navTo('home')" style="width: 60px;">◀ ホーム</button>
        <div class="header-center">
            <div class="header-title" id="study-title">すべて出題</div>
            <div class="header-sub" id="remaining-count"></div>
        </div>
        <button class="reset-btn" id="reset-btn" onclick="resetProgress()">🔄 リセット</button>
    </header>
    <div id="card-container">
        <div id="empty-msg" class="hidden">単語がありません！</div>
        <div id="flashcard" class="card">
            <div id="word-ja">日本語</div>
            <div id="word-en" class="english-ans">English</div>
            <button id="speaker-btn" class="audio-btn">🔊 音声を聞く</button>
            <div id="swipe-hint" class="instruction">PC:ドラッグ / スマホ:タッチしてスワイプ</div>
        </div>
    </div>
</div>

<div id="add-screen" class="screen">
    <header>
        <button class="back-btn" onclick="navTo('home')">◀ ホーム</button>
        <div class="header-title">単語を追加・編集</div>
        <div style="width: 50px;"></div>
    </header>
    <div class="content">
        <div class="section-box">
            <div class="section-title">手動で追加</div>
            <input type="text" id="input-ja" placeholder="日本語">
            <input type="text" id="input-en" placeholder="英語">
            <button class="action-btn" id="add-btn">現在の単語帳に追加</button>
        </div>
        <div class="section-box">
            <div class="section-title">✏️ 現在の単語帳の編集・削除</div>
            <input type="text" id="edit-search" placeholder="🔍 英語か日本語で検索...">
            <div id="edit-word-list" style="max-height: 40vh; overflow-y: auto; padding-right: 5px;"></div>
        </div>
    </div>
</div>

<div id="deck-screen" class="screen">
    <header>
        <button class="back-btn" onclick="navTo('home')">◀ ホーム</button>
        <div class="header-title">単語帳の管理</div>
        <div style="width: 50px;"></div>
    </header>
    <div class="content">
        <div class="section-box">
            <div class="section-title">新しい単語帳を作成</div>
            <input type="text" id="new-deck-name" placeholder="例：第1章 復習用" style="margin-bottom: 15px;">
            
            <div style="font-size: 0.9em; font-weight: bold; margin-bottom: 5px;">この単語帳に入れる単語を選ぶ（全登録単語から）:</div>
            <div class="check-btn-group">
                <button onclick="checkAllWords(true)">すべて選択</button>
                <button onclick="checkAllWords(false)">すべて外す</button>
            </div>
            <input type="text" id="deck-word-search" placeholder="🔍 単語を検索して絞り込み...">
            <div id="deck-creation-word-list" style="max-height: 25vh; overflow-y: auto; border: 1px solid #ddd; padding: 5px; border-radius: 5px; margin-bottom: 10px; background: #fafafa;">
                </div>
            
            <button class="action-btn" onclick="createNewDeck()">選択した単語で作成</button>
        </div>
        <div class="section-box">
            <div class="section-title">単語帳を切り替える</div>
            <div id="deck-list"></div>
        </div>
    </div>
</div>

<div id="settings-screen" class="screen">
    <header>
        <button class="back-btn" onclick="navTo('home')">◀ ホーム</button>
        <div class="header-title">設定</div>
        <div style="width: 50px;"></div>
    </header>
    <div class="content">
        <div class="section-box">
            <div class="setting-row" style="display: block; margin-bottom: 15px;">
                <div style="margin-bottom: 5px; font-weight: bold;">音声の種類（ネイティブ発音を選択）</div>
                <select id="setting-voice" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;"></select>
                <div style="font-size: 0.8em; color: #7f8c8d; margin-top: 5px;">スマホで発音がおかしい場合は、ここからSamanthaなどに変更してください。</div>
            </div>
            <div class="setting-row" style="display: block;">
                <div style="margin-bottom: 10px; font-weight: bold;">出題形式</div>
                <select id="setting-playmode" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    <option value="once">1周モード（続きから再開可能）</option>
                    <option value="random">完全ランダムモード（無限に出題）</option>
                </select>
            </div>
            <div class="setting-row">
                <span>自動音声再生</span>
                <input type="checkbox" id="setting-autoplay" style="width: 20px; height: 20px;">
            </div>
            <div class="setting-row">
                <span>音量</span>
                <input type="range" id="setting-volume" min="0" max="1" step="0.1" value="1">
                <span id="volume-val">100%</span>
            </div>
        </div>
    </div>
</div>

    let oldWords = JSON.parse(localStorage.getItem('myWords'));
    let appData = JSON.parse(localStorage.getItem('myVocabApp_v2'));

    // データの引き継ぎと新規追加分のマージ
    if (!appData) {
        appData = {
            activeDeckId: 'deck_1',
            decks: { 'deck_1': { id: 'deck_1', name: '基本の単語帳', words: oldWords ? oldWords : initialWords } },
            settings: { volume: 1.0, autoPlay: false, playMode: 'once', voiceURI: '' }
        };
        saveData();
    } else {
        if (!appData.settings.playMode) {
            appData.settings.playMode = 'once'; appData.settings.voiceURI = '';
        }
        let mainDeck = appData.decks['deck_1'];
        if (mainDeck) {
            initialWords.forEach(newWord => {
                const exists = mainDeck.words.some(w => w.en === newWord.en);
                if (!exists) mainDeck.words.push(newWord);
            });
        }
        saveData();
    }

    function saveData() { localStorage.setItem('myVocabApp_v2', JSON.stringify(appData)); }
    function getActiveWords() { return appData.decks[appData.activeDeckId].words; }

    // これまでに登録された全単語（マスターデータ）を取得する関数
    function getMasterWords() {
        let allWordsMap = new Map();
        Object.values(appData.decks).forEach(deck => {
            deck.words.forEach(w => {
                if (!allWordsMap.has(w.en)) allWordsMap.set(w.en, { ja: w.ja, en: w.en, weak: w.weak });
            });
        });
        return Array.from(allWordsMap.values());
    }

    // ★iOS対策：ユーザー操作時に無音を再生してオーディオ制限を解除★
    let audioUnlocked = false;
    function unlockAudio() {
        if (!audioUnlocked) {
            const silentUtterance = new SpeechSynthesisUtterance('');
            silentUtterance.volume = 0;
            speechSynthesis.speak(silentUtterance);
            audioUnlocked = true;
        }
    }

    let voices = [];
    function populateVoiceList() {
        voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
        const voiceSelect = document.getElementById('setting-voice');
        voiceSelect.innerHTML = '<option value="">デフォルト（自動）</option>';
        voices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.voiceURI;
            option.textContent = `${voice.name} (${voice.lang})`;
            if(appData.settings.voiceURI === voice.voiceURI) option.selected = true;
            voiceSelect.appendChild(option);
        });
    }
    speechSynthesis.onvoiceschanged = populateVoiceList;
    setTimeout(populateVoiceList, 500);

    let currentStudyMode = 'all';

    function navTo(screenId) {
        unlockAudio(); // メニューボタンを押した瞬間にオーディオのロックを解除

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        
        if (screenId === 'study-all' || screenId === 'study-weak') {
            document.getElementById('study-screen').classList.add('active');
            currentStudyMode = screenId === 'study-weak' ? 'weak' : 'all';
            document.getElementById('study-title').innerText = currentStudyMode === 'weak' ? '苦手モード' : 'すべて出題';
            document.getElementById('reset-btn').style.display = appData.settings.playMode === 'once' ? 'block' : 'none';
            initDeck();
        } else {
            document.getElementById(screenId + '-screen').classList.add('active');
            if (screenId === 'deck') {
                selectedWordsForNewDeck.clear();
                document.getElementById('deck-word-search').value = '';
                renderDeckCreationWordList();
                renderDeckList();
            }
            if (screenId === 'add') renderEditList();
            if (screenId === 'settings') populateVoiceList();
        }
    }

    let currentDeck = [], currentIndex = 0, isFlipped = false;
    const card = document.getElementById('flashcard');
    const wordJaEl = document.getElementById('word-ja');
    const wordEnEl = document.getElementById('word-en');
    const speakerBtn = document.getElementById('speaker-btn');
    const hintEl = document.getElementById('swipe-hint');
    const emptyMsg = document.getElementById('empty-msg');
    const remainingCountEl = document.getElementById('remaining-count');

    function playAudio(text) {
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.volume = appData.settings.volume;
        if(appData.settings.voiceURI && voices.length > 0) {
            const selectedVoice = voices.find(v => v.voiceURI === appData.settings.voiceURI);
            if(selectedVoice) uttr.voice = selectedVoice;
        }
        speechSynthesis.cancel();
        speechSynthesis.speak(uttr);
    }

    function initDeck() {
        const words = getActiveWords();
        const mode = currentStudyMode;
        const deckData = appData.decks[appData.activeDeckId];

        if (appData.settings.playMode === 'once') {
            if (!deckData.savedState) deckData.savedState = {};
            
            if (deckData.savedState[mode] && deckData.savedState[mode].index < deckData.savedState[mode].queue.length) {
                currentDeck = deckData.savedState[mode].queue;
                currentIndex = deckData.savedState[mode].index;
            } else {
                currentDeck = mode === 'weak' ? words.filter(w => w.weak === true) : [...words];
                currentDeck.sort(() => Math.random() - 0.5);
                currentIndex = 0;
                deckData.savedState[mode] = { queue: currentDeck, index: currentIndex };
                saveData();
            }
        } else {
            currentDeck = mode === 'weak' ? words.filter(w => w.weak === true) : [...words];
            currentDeck.sort(() => Math.random() - 0.5);
            currentIndex = 0;
        }
        showCard();
    }

    function resetProgress() {
        if(confirm("このモードの進捗をリセットして、最初からやり直しますか？")) {
            const deckData = appData.decks[appData.activeDeckId];
            if(deckData.savedState) deckData.savedState[currentStudyMode] = null;
            saveData();
            initDeck();
        }
    }

    function showCard() {
        card.style.transform = 'translateX(0px)';
        card.style.opacity = '1';
        isFlipped = false;
        wordEnEl.style.display = 'none';
        speakerBtn.style.display = 'none';
        
        if (currentDeck.length === 0) {
            card.classList.add('hidden');
            emptyMsg.classList.remove('hidden');
            emptyMsg.innerText = "このモードの単語がありません";
            remainingCountEl.innerText = "";
            return;
        }

        if (appData.settings.playMode === 'once') {
            if (currentIndex >= currentDeck.length) {
                card.classList.add('hidden');
                emptyMsg.classList.remove('hidden');
                emptyMsg.innerText = "1周終わりました！";
                remainingCountEl.innerText = "残り: 0 単語";
                
                const deckData = appData.decks[appData.activeDeckId];
                if(deckData.savedState) deckData.savedState[currentStudyMode] = null;
                saveData();
                return;
            }
            remainingCountEl.innerText = `残り: ${currentDeck.length - currentIndex} 単語`;
        } else {
            remainingCountEl.innerText = "∞ ランダムモード";
        }

        card.classList.remove('hidden');
        emptyMsg.classList.add('hidden');
        wordJaEl.innerText = currentDeck[currentIndex].ja;
        wordEnEl.innerText = currentDeck[currentIndex].en;
        hintEl.innerText = "タッチまたはクリックして答えを表示";
    }

    function flipCard() {
        if (isFlipped) return;
        isFlipped = true;
        wordEnEl.style.display = 'block';
        speakerBtn.style.display = 'inline-block';
        hintEl.innerText = "← 左:ミス(苦手) / 右:正解(覚えた) →";
        if (appData.settings.autoPlay) playAudio(currentDeck[currentIndex].en);
    }

    let startX = 0, isDragging = false;
    
    card.addEventListener('pointerdown', e => {
        if (e.target.id === 'speaker-btn') return;
        flipCard();
        startX = e.pageX;
        isDragging = true;
        card.setPointerCapture(e.pointerId);
    });

    speakerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playAudio(currentDeck[currentIndex].en);
    });
    speakerBtn.addEventListener('pointerdown', (e) => e.stopPropagation());

    function handleSwipe(direction) {
        if (!isFlipped) return;
        const currentWord = currentDeck[currentIndex];
        const activeWords = getActiveWords();
        const originalWord = activeWords.find(w => w.en === currentWord.en && w.ja === currentWord.ja);
        
        if (originalWord) {
            if (direction === 'right') {
                originalWord.weak = false;
                card.style.transform = 'translateX(100vw) rotate(15deg)';
            } else {
                originalWord.weak = true;
                card.style.transform = 'translateX(-100vw) rotate(-15deg)';
            }
        }
        
        card.style.opacity = '0';
        
        setTimeout(() => {
            if (appData.settings.playMode === 'once') {
                currentIndex++;
                const deckData = appData.decks[appData.activeDeckId];
                if(!deckData.savedState) deckData.savedState = {};
                if(deckData.savedState[currentStudyMode]) deckData.savedState[currentStudyMode].index = currentIndex;
            } else {
                currentIndex = Math.floor(Math.random() * currentDeck.length);
            }
            saveData();
            showCard();
        }, 300);
    }

    card.addEventListener('pointerup', e => {
        if (!isDragging || !isFlipped) return;
        isDragging = false;
        let diffX = e.pageX - startX;
        if (diffX > 50) handleSwipe('right');
        else if (diffX < -50) handleSwipe('left');
    });
    card.addEventListener('pointercancel', () => isDragging = false);

    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT') return;
        if (document.getElementById('study-screen').classList.contains('active') === false) return;
        if (card.classList.contains('hidden')) return;

        if (e.code === 'Space' || e.code === 'Enter') { 
            e.preventDefault(); 
            flipCard(); 
        }
        else if (e.code === 'ArrowRight' && isFlipped) handleSwipe('right');
        else if (e.code === 'ArrowLeft' && isFlipped) handleSwipe('left');
    });

    // ========== 編集・追加機能 ==========
    document.getElementById('add-btn').addEventListener('click', () => {
        const ja = document.getElementById('input-ja').value.trim();
        const en = document.getElementById('input-en').value.trim();
        if (ja && en) { 
            getActiveWords().unshift({ ja, en, weak: false });
            saveData(); 
            document.getElementById('input-ja').value = ''; 
            document.getElementById('input-en').value = ''; 
            alert('追加しました！'); 
            renderEditList(); 
        }
    });

    function renderEditList(filterText = '') {
        const listEl = document.getElementById('edit-word-list'); listEl.innerHTML = ''; const words = getActiveWords();
        words.forEach((word, index) => {
            if (filterText && !word.ja.includes(filterText) && !word.en.toLowerCase().includes(filterText.toLowerCase())) return;
            const div = document.createElement('div'); div.className = 'edit-row';
            const enInput = document.createElement('input'); enInput.type = 'text'; enInput.value = word.en; enInput.placeholder = "英語"; enInput.onchange = (e) => { word.en = e.target.value.trim(); saveData(); };
            const jaInput = document.createElement('input'); jaInput.type = 'text'; jaInput.value = word.ja; jaInput.placeholder = "日本語"; jaInput.onchange = (e) => { word.ja = e.target.value.trim(); saveData(); };
            const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.innerText = '🗑️';
            delBtn.onclick = () => { if (confirm('削除しますか？')) { words.splice(index, 1); saveData(); renderEditList(document.getElementById('edit-search').value); } };
            div.appendChild(enInput); div.appendChild(jaInput); div.appendChild(delBtn); listEl.appendChild(div);
        });
    }

    document.getElementById('edit-search').addEventListener('input', (e) => { renderEditList(e.target.value); });

    // ========== 単語帳管理機能（新：全単語リストからの選択） ==========
    let selectedWordsForNewDeck = new Set();

    function renderDeckCreationWordList(filterText = '') {
        const listEl = document.getElementById('deck-creation-word-list');
        listEl.innerHTML = '';
        let masterWords = getMasterWords();
        
        masterWords.forEach((word) => {
            if (filterText && !word.ja.includes(filterText) && !word.en.toLowerCase().includes(filterText.toLowerCase())) return;
            
            const label = document.createElement('label');
            label.style.display = 'block';
            label.style.padding = '8px 5px';
            label.style.borderBottom = '1px solid #eee';
            
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'deck-word-cb';
            cb.checked = selectedWordsForNewDeck.has(word.en);
            cb.onchange = (e) => {
                if (e.target.checked) selectedWordsForNewDeck.add(word.en);
                else selectedWordsForNewDeck.delete(word.en);
            };
            
            const span = document.createElement('span');
            span.style.marginLeft = '8px';
            span.innerText = `${word.en} - ${word.ja}`;
            
            label.appendChild(cb);
            label.appendChild(span);
            listEl.appendChild(label);
        });
    }

    document.getElementById('deck-word-search').addEventListener('input', (e) => { renderDeckCreationWordList(e.target.value); });

    function checkAllWords(check) {
        let masterWords = getMasterWords();
        const filter = document.getElementById('deck-word-search').value.toLowerCase();
        
        masterWords.forEach(word => {
            if (filter && !word.ja.includes(filter) && !word.en.toLowerCase().includes(filter)) return;
            if (check) selectedWordsForNewDeck.add(word.en);
            else selectedWordsForNewDeck.delete(word.en);
        });
        renderDeckCreationWordList(filter);
    }

    function renderDeckList() {
        const listEl = document.getElementById('deck-list'); listEl.innerHTML = '';
        Object.values(appData.decks).forEach(deck => {
            const div = document.createElement('div');
            div.className = `deck-item ${appData.activeDeckId === deck.id ? 'active-deck' : ''}`;
            div.innerHTML = `<div><strong>${deck.name}</strong> <br><small>${deck.words.length} 単語</small></div>`;
            div.onclick = () => { appData.activeDeckId = deck.id; saveData(); renderDeckList(); };
            listEl.appendChild(div);
        });
    }

    function createNewDeck() {
        const name = document.getElementById('new-deck-name').value.trim();
        if (!name) { alert("単語帳の名前を入力してください！"); return; }
        
        let masterWords = getMasterWords();
        let newWords = masterWords.filter(w => selectedWordsForNewDeck.has(w.en));
        
        if (newWords.length === 0) {
            if (!confirm("単語が1つも選ばれていませんが、空の単語帳を作成しますか？")) return;
        }

        const newId = 'deck_' + Date.now();
        appData.decks[newId] = { id: newId, name: name, words: newWords };
        appData.activeDeckId = newId; 
        saveData(); 
        
        document.getElementById('new-deck-name').value = ''; 
        selectedWordsForNewDeck.clear();
        document.getElementById('deck-word-search').value = '';
        
        renderDeckList();
        renderDeckCreationWordList();
        alert(`「${name}」を作成し、${newWords.length}単語を追加しました！`);
    }

    // ========== 設定 ==========
    const volInput = document.getElementById('setting-volume'); 
    const autoPlayInput = document.getElementById('setting-autoplay');
    const playModeInput = document.getElementById('setting-playmode');
    const voiceInput = document.getElementById('setting-voice');
    
    volInput.value = appData.settings.volume; 
    document.getElementById('volume-val').innerText = Math.round(appData.settings.volume * 100) + '%';
    autoPlayInput.checked = appData.settings.autoPlay;
    playModeInput.value = appData.settings.playMode;

    volInput.addEventListener('input', (e) => { appData.settings.volume = parseFloat(e.target.value); document.getElementById('volume-val').innerText = Math.round(appData.settings.volume * 100) + '%'; saveData(); });
    autoPlayInput.addEventListener('change', (e) => { appData.settings.autoPlay = e.target.checked; saveData(); });
    playModeInput.addEventListener('change', (e) => { appData.settings.playMode = e.target.value; saveData(); });
    voiceInput.addEventListener('change', (e) => { appData.settings.voiceURI = e.target.value; saveData(); });
</script>
</body>
</html>
